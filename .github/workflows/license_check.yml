name: License Check

on: [pull_request]

permissions:
  contents: read

jobs:
  license-check:
    name: license boilerplate check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Extract version of Go to use
        run: echo "GOVERSION=$(awk -F 'golang:' 'NF>1 {split($2, a, /[-@]/); print a[1]; exit}' Dockerfile)" >> $GITHUB_ENV
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GOVERSION }}
          check-latest: true
      - name: Check license headers
        run: |
          set -e
          go tool addlicense -check -l apache -c 'The Sigstore Authors' -ignore "third_party/**" -ignore "tests/testdata/**" -v *

  dependency-license-review:
    name: License and Vulnerability Scan
    uses: sigstore/community/.github/workflows/reusable-dependency-review.yml@18fef82db5e64053834d9072b21c54e44cc76e6a

